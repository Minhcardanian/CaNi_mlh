name: Product CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: product-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol:
    name: Permit and Cardano protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Aiken
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.13
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
