name: nightpermit-cardano-providers

services:
  kupo:
    image: cardanosolutions/kupo@sha256:7d3c62368a4a5a609f5cf0ee6949eb8d491ed8f5a4d05b38da3213d95735f03b
    container_name: nightpermit-kupo
    user: ${CARDANO_PROVIDER_UID:?set CARDANO_PROVIDER_UID}:${CARDANO_PROVIDER_GID:?set CARDANO_PROVIDER_GID}
    command:
      - --node-socket
      - /ipc/node.socket
      - --node-config
      - /config/config.json
      - --workdir
      - /db
      - --host
      - 0.0.0.0
      - --port
      - "1442"
      - --since
      - tip
      - --match
      - "*/*"
      - --prune-utxo
    ports:
      - 127.0.0.1:1442:1442
    volumes:
      - type: bind
        source: ${CARDANO_PREVIEW_DB_DIR:?set CARDANO_PREVIEW_DB_DIR}
        target: /ipc
        read_only: true
      - type: bind
        source: ${CARDANO_PREVIEW_CONFIG_DIR:?set CARDANO_PREVIEW_CONFIG_DIR}
        target: /config
        read_only: true
      - type: bind
        source: ${CARDANO_PREVIEW_KUPO_DIR:?set CARDANO_PREVIEW_KUPO_DIR}
        target: /db
    healthcheck:
      test: [CMD, /bin/kupo, health-check, --host, 127.0.0.1, --port, "1442"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
